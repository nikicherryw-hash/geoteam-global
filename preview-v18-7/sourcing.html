<script id="gt-sourcing-shell-language">
(() => {
  const labels={en:'Home',tr:'Ana sayfa',ru:'На главную',de:'Startseite',fr:'Accueil',es:'Inicio',it:'Home',pt:'Início',ar:'الرئيسية',zh:'首页'};
  const select=document.getElementById('lang'),back=document.getElementById('back');
  const requested=new URLSearchParams(location.search).get('lang');
  const language=labels[requested] ? requested : 'ru';
  const render=code=>{document.documentElement.lang=code;back.textContent=`← ${labels[code]}`;back.href=`index.html?lang=${encodeURIComponent(code)}`;};
  if(select){select.value=language;select.addEventListener('change',()=>{const next=new URL(location.href);next.searchParams.set('lang',select.value);location.assign(next.toString());});}
  render(language);
})();
</script>
<script id="gt-sourcing-status-contract">
(() => {
  const status = document.getElementById('status');
  if (!status) return;
  const copy = {
    en: { global: 'Ready for global search.', local: 'Local search mode is active.', offline: 'Search is temporarily unavailable.' },
    ru: { global: 'Готово к глобальному поиску.', local: 'Работает локальный поиск.', offline: 'Поиск временно недоступен.' },
    tr: { global: 'Küresel arama hazır.', local: 'Yerel arama modu etkin.', offline: 'Arama geçici olarak kullanılamıyor.' }
  };
  const language = new URLSearchParams(window.location.search).get('lang') || 'ru';
  window.GeoTeamSearchStatus = {
    set(state = 'global', message) {
      status.dataset.state = ['global', 'local', 'offline'].includes(state) ? state : 'offline';
      status.textContent = message || ((copy[language] || copy.en)[status.dataset.state] || copy.en.global);
    }
  };
  window.GeoTeamSearchStatus.set('global');
})();
</script>
<script src="geoteam-ai-config.js"></script><script defer src="geoteam-ai-pilot.js?v=20261102T2003"></script><script defer src="geoteam-commerce.js?v=20261102T2001"></script>
<script id="gt-sourcing-product-order">
(() => {
  const results=document.getElementById('results');
  if(!results)return;
  const arrange=()=>results.querySelectorAll('.product').forEach(product=>{
    const image=product.querySelector('img');
    const title=product.querySelector('h2');
    if(image&&title&&title.nextElementSibling!==image)title.after(image);
  });
  new MutationObserver(arrange).observe(results,{childList:true,subtree:true});
  arrange();
})();
</script>
