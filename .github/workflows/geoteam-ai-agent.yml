name: GeoTeam AI Agent QA
on:
  push:
    branches: [geoteam-v18-47-openai-agent]
  pull_request:
    paths: ["sourcing/search_v2/**", ".github/workflows/geoteam-ai-agent.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r sourcing/search_v2/requirements.txt
      - run: python -m compileall -q sourcing/search_v2
      - run: python -m unittest discover -v -s sourcing/search_v2 -p "test_*.py"
